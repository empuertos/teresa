<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Stream - Optimized Loading</title>
    
    <!-- HLS.js library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Pre-connect para mas mabilis ang DNS resolution -->
    <link rel="preconnect" href="https://vidlink.pro">
    <link rel="preconnect" href="https://vidsrc.net">
    <link rel="preconnect" href="https://showbox.media">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            max-width: 960px;
            width: 100%;
        }
        h2 { color: #fff; text-align: center; margin-bottom: 5px; }
        .subtitle { color: #aaa; text-align: center; margin-bottom: 20px; font-size: 14px; }
        
        /* === VIDEO PLAYER WITH SPINNER OVERLAY === */
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            max-height: 500px;
            aspect-ratio: 16 / 9;
        }
        .player-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Spinner overlay */
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; /* Nakatago sa simula */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            color: white;
            border-radius: 12px;
        }
        #loadingOverlay.active {
            display: flex;
        }
        .spinner {
            border: 6px solid #444;
            border-top: 6px solid #e94560;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loadingText {
            font-size: 16px;
            color: #ccc;
        }
        #loadingTimer {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .controls select, .controls input {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            background: #0f3460;
            color: #fff;
            min-width: 150px;
        }
        .controls select option { background: #1a1a2e; }
        .controls input::placeholder { color: #888; }
        
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover { background: #c73652; transform: scale(1.03); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        #logArea {
            background: #0f0f1f;
            color: #0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-badge { color: #ffd700; font-weight: bold; }
        .provider-info { color: #4fc3f7; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Movie Stream Engine</h2>
    <p class="subtitle">⚡ <span class="status-badge">FETCH</span> ➔ <span class="status-badge">INJECT</span> (may Loading Spinner at Timeout)</p>

    <!-- PLAYER WRAPPER -->
    <div class="player-wrapper" id="playerWrapper">
        <video id="myMoviePlayer" controls width="100%"></video>
        
        <!-- LOADING OVERLAY -->
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">⏳ Naglo-load ng video...</div>
            <div id="loadingTimer">0s</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <select id="providerSelect">
            <option value="vidlink">Vidlink.pro</option>
            <option value="vidsrc">Vidsrc.net</option>
            <option value="vidsrc_cc">Vidsrc.cc</option>
            <option value="embed_su">Embed.su</option>
            <option value="2embed">2Embed</option>
            <option value="showbox">Showbox</option>
            <option value="febbox">FebBox</option>
            <option value="4khdhub">4KHDHub</option>
            <option value="videasy">Videasy</option>
            <option value="streamflix">StreamFlix</option>
            <option value="vaplayer">VaPlayer</option>
            <option value="zxcstreams">ZXCStreams</option>
            <option value="kisskh">kisskh</option>
            <option value="onetouchtv">onetouchtv</option>
            <option value="kkphim">kkphim</option>
        </select>
        
        <input type="text" id="movieIdInput" placeholder="TMDB ID (e.g. 597)" value="597">
        
        <button id="loadBtn" onclick="fetchAndInjectStream()">🚀 I-Fetch at I-Inject</button>
        <button onclick="resetPlayer()" style="background:#555;">⏹ Reset</button>
    </div>

    <!-- LOGS -->
    <div id="logArea">
        🔍 [System] Handa na. Pumili ng provider...
    </div>
    <div class="provider-info">💡 Kung mabagal ang isang provider, subukan ang iba (hal. palitan ang Vidlink -> Showbox)</div>
</div>

<script>
    // --- ELEMENTS ---
    let video = document.getElementById('myMoviePlayer');
    const log = document.getElementById('logArea');
    const loadBtn = document.getElementById('loadBtn');
    const providerSelect = document.getElementById('providerSelect');
    const movieIdInput = document.getElementById('movieIdInput');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingTimer = document.getElementById('loadingTimer');
    const playerWrapper = document.getElementById('playerWrapper');

    let loadingTimeout = null;
    let timerInterval = null;
    let seconds = 0;

    // --- LOADING SPINNER CONTROLS ---
    function showLoading(message = '⏳ Naglo-load ng video...') {
        loadingOverlay.classList.add('active');
        loadingText.textContent = message;
        seconds = 0;
        loadingTimer.textContent = '0s';
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            seconds++;
            loadingTimer.textContent = `${seconds}s`;
            if (seconds > 15) {
                loadingText.textContent = '⏳ Medyo natatagalan... (subukan ang ibang provider)';
            }
            if (seconds > 25) {
                loadingText.textContent = '⚠️ Matagal na masyado. I-click ang Reset at subukan ibang provider.';
            }
        }, 1000);

        // Auto-hide after 30 seconds (timeout)
        if (loadingTimeout) clearTimeout(loadingTimeout);
        loadingTimeout = setTimeout(() => {
            hideLoading(true);
            addLog('⏰ [TIMEOUT] Matagal bago nag-load ang video (30s). Subukan ang ibang provider.', true);
        }, 30000);
    }

    function hideLoading(isTimeout = false) {
        loadingOverlay.classList.remove('active');
        if (timerInterval) clearInterval(timerInterval);
        if (loadingTimeout) clearTimeout(loadingTimeout);
        if (!isTimeout) {
            addLog('✅ Tapos na ang paglo-load ng video.');
        }
    }

    // --- HELPER: Add log ---
    function addLog(message, isError = false) {
        const timestamp = new Date().toLocaleTimeString();
        const prefix = isError ? '❌' : '✅';
        log.innerHTML += `\n[${timestamp}] ${prefix} ${message}`;
        log.scrollTop = log.scrollHeight;
        console.log(message);
    }

    // --- RESET PLAYER ---
    function resetPlayer() {
        hideLoading();
        const currentPlayer = window.currentPlayer;
        if (currentPlayer && currentPlayer.tagName === 'IFRAME') {
            const newVideo = document.createElement('video');
            newVideo.id = 'myMoviePlayer';
            newVideo.controls = true;
            newVideo.width = '100%';
            newVideo.style.width = '100%';
            newVideo.style.height = '100%';
            newVideo.style.background = '#000';
            currentPlayer.parentNode.replaceChild(newVideo, currentPlayer);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
            addLog('🔄 Na-reset ang player.');
        } else {
            video.pause();
            video.currentTime = 0;
            video.src = '';
            addLog('🔄 Na-reset ang video player.');
        }
    }

    // --- PROVIDERS (same as before, dinagdagan lang ng konti) ---
    const PROVIDERS = {
        vidlink: {
            name: 'Vidlink.pro',
            getStreamUrl: async (tmdbId) => {
                const url = `https://vidlink.pro/api/vidlink/watch?isMovie=true&id=${tmdbId}`;
                addLog(`🌐 [Vidlink] Tumatawag sa API...`);
                // May timeout na 15 seconds ang fetch
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                try {
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const data = await response.json();
                    if (data && data.stream && data.stream.playlist) {
                        return data.stream.playlist;
                    }
                    throw new Error('Walang nakitang stream URL');
                } catch (err) {
                    clearTimeout(timeoutId);
                    throw new Error(`Vidlink API error: ${err.message}`);
                }
            }
        },
        vidsrc: { name: 'Vidsrc.net', getStreamUrl: async (id) => `https://vidsrc.net/embed/movie/${id}` },
        vidsrc_cc: { name: 'Vidsrc.cc', getStreamUrl: async (id) => `https://vidsrc.cc/v2/embed/movie/${id}?poster=true&autoPlay=false` },
        embed_su: { name: 'Embed.su', getStreamUrl: async (id) => `https://embed.su/embed/movie/${id}` },
        '2embed': { name: '2Embed', getStreamUrl: async (id) => `https://www.2embed.cc/embed/movie/${id}` },
        showbox: { name: 'Showbox', getStreamUrl: async (id) => `https://showbox.media/embed/movie/${id}` },
        febbox: { name: 'FebBox', getStreamUrl: async (id) => `https://febbox.com/embed/movie/${id}` },
        '4khdhub': { name: '4KHDHub', getStreamUrl: async (id) => `https://4khdhub.com/embed/movie/${id}` },
        videasy: { name: 'Videasy', getStreamUrl: async (id) => `https://videasy.net/embed/movie/${id}` },
        streamflix: { name: 'StreamFlix', getStreamUrl: async (id) => `https://streamflix.to/embed/movie/${id}` },
        vaplayer: { name: 'VaPlayer', getStreamUrl: async (id) => `https://vaplayer.xyz/embed/movie/${id}` },
        zxcstreams: { name: 'ZXCStreams', getStreamUrl: async (id) => `https://zxcstreams.com/embed/movie/${id}` },
        kisskh: { name: 'kisskh', getStreamUrl: async (id) => `https://kisskh.co/movie/${id}` },
        onetouchtv: { name: 'onetouchtv', getStreamUrl: async (id) => `https://onetouchtv.com/embed/movie/${id}` },
        kkphim: { name: 'kkphim', getStreamUrl: async (id) => `https://kkphim.com/phim/${id}` }
    };

    function isEmbedUrl(url) {
        const patterns = ['/embed/', 'vidsrc.cc', 'embed.su', '2embed.cc', 'showbox.media', 'febbox.com', '4khdhub.com', 'videasy.net', 'streamflix.to', 'vaplayer.xyz', 'zxcstreams.com', 'kisskh.co', 'onetouchtv.com', 'kkphim.com'];
        return patterns.some(p => url.includes(p));
    }

    // --- INJECT FUNCTIONS (with loading hide) ---
    function injectIframe(embedUrl) {
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allowFullscreen = true;
        iframe.allow = 'autoplay; encrypted-media; fullscreen';
        
        // Kapag nag-load na ang iframe, itago ang spinner
        iframe.onload = function() {
            hideLoading();
            addLog('🖼️ [IFRAME] Na-load na ang player!');
        };
        iframe.onerror = function() {
            hideLoading(true);
            addLog('💥 [IFRAME] Nag-error ang pag-load ng iframe.', true);
        };

        video.parentNode.replaceChild(iframe, video);
        window.currentPlayer = iframe;
        addLog('✅ [INJECT] Na-inject na ang iframe player. Naghihintay ng load...');
    }

    function injectHLS(streamUrl) {
        // I-restore ang video tag kung iframe
        if (window.currentPlayer && window.currentPlayer.tagName === 'IFRAME') {
            const newVideo = document.createElement('video');
            newVideo.id = 'myMoviePlayer';
            newVideo.controls = true;
            newVideo.style.width = '100%';
            newVideo.style.height = '100%';
            newVideo.style.background = '#000';
            window.currentPlayer.parentNode.replaceChild(newVideo, window.currentPlayer);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
        }

        if (Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            addLog('✅ [INJECT] HLS stream attached. Naghihintay ng manifest...');

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                hideLoading(); // <-- Itago ang spinner kapag handa na
                addLog('🎉 Handa na ang stream! Awtomatikong nagpe-play...');
                video.play().catch(e => addLog('⚠️ Kailangan i-click ang play manually.', true));
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    hideLoading(true);
                    addLog(`💥 [ERROR] Fatal error sa stream: ${data.type}`, true);
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.onloadedmetadata = () => hideLoading();
            video.play();
            addLog('🍎 Native HLS (Safari)');
        } else {
            hideLoading(true);
            addLog('🚫 Hindi supported ang HLS.', true);
        }
    }

    // --- CORE FETCH & INJECT ---
    async function fetchAndInjectStream() {
        loadBtn.disabled = true;
        loadBtn.textContent = '⏳ Nagfa-fetch...';
        log.innerHTML = '';
        addLog('⚡ Nagsisimula...');

        const providerKey = providerSelect.value;
        const tmdbId = movieIdInput.value.trim();

        if (!tmdbId) {
            addLog('⚠️ Maglagay ng TMDB ID (hal. 597)', true);
            loadBtn.disabled = false;
            loadBtn.textContent = '🚀 I-Fetch at I-Inject';
            return;
        }

        const provider = PROVIDERS[providerKey];
        if (!provider) {
            addLog(`⚠️ Unknown provider`, true);
            loadBtn.disabled = false;
            loadBtn.textContent = '🚀 I-Fetch at I-Inject';
            return;
        }

        // Show spinner
        showLoading(`⏳ Kinukuha ang stream mula sa ${provider.name}...`);

        try {
            addLog(`📡 Provider: ${provider.name} | TMDB ID: ${tmdbId}`);
            const streamUrl = await provider.getStreamUrl(tmdbId);
            addLog(`🔗 Nakuha ang URL`);

            // Itago ang spinner after fetching, pero ipapakita ulit while injecting
            // Actually, i-keep natin ang spinner hanggang mag-load ang video.
            // So hindi natin tatawagin ang hideLoading dito.

            if (isEmbedUrl(streamUrl)) {
                addLog('🖼️ Embed detected');
                injectIframe(streamUrl);
            } else if (streamUrl.endsWith('.m3u8') || streamUrl.includes('m3u8')) {
                addLog('📹 HLS detected');
                injectHLS(streamUrl);
            } else if (streamUrl.endsWith('.mp4')) {
                addLog('📹 MP4 detected');
                video.src = streamUrl;
                video.onloadedmetadata = () => hideLoading();
                video.play();
            } else {
                addLog('🔄 Unknown format, trying HLS...');
                injectHLS(streamUrl);
            }

        } catch (error) {
            hideLoading(true);
            addLog(`🔥 [ERROR] ${error.message}`, true);
            addLog('💡 Tip: Subukan ang ibang provider (hal. Showbox, Vidsrc, o 2Embed)', false);
        } finally {
            loadBtn.disabled = false;
            loadBtn.textContent = '🔄 I-Fetch ulit';
        }
    }

    // --- EVENT LISTENERS ---
    video.addEventListener('play', () => addLog('▶️ Playing'));
    video.addEventListener('pause', () => addLog('⏸️ Paused'));
    video.addEventListener('ended', () => addLog('⏹️ Ended'));

    // Initial log
    addLog('💡 Pindutin ang button. Kung mabagal, palitan ang provider.');
    addLog('📌 Mabilis na providers: Showbox, Vidsrc.net, 2Embed');
</script>
</body>
</html>
