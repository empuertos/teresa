<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HD Printable Derby Match Program</title>
  <style>
    :root { 
      --bg: #0b0f19; 
      --card: #151c2c; 
      --border: #2a364f; 
      --text: #f1f5f9; 
      --meron: #dc2626; 
      --wala: #0284c7; 
      --gold: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    
    .card-panel { background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 0.8rem; display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.85rem; color: #94a3b8; }
    input, select, textarea { background: #0b0f19; border: 1px solid var(--border); color: var(--text); padding: 0.6rem; border-radius: 6px; font-size: 0.9rem; }
    
    .btn { background: #2563eb; color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-action { background: #10b981; }
    .btn-print { background: #d97706; }
    .btn-csv { background: #0ea5e9; }
    .btn-group { display: flex; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }
    
    .page-nav { display: flex; gap: 0.5rem; background: var(--card); padding: 0.5rem; border-radius: 10px; border: 1px solid var(--border); }
    .page-btn { flex: 1; background: #0b0f19; border: 1px solid var(--border); color: #94a3b8; padding: 0.8rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .page-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    
    .page-view { display: none; }
    .page-view.active { display: block; }

    /* Modern Banner */
    .modern-banner { text-align: center; border: 2px solid var(--gold); background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 1.2rem; border-radius: 8px; margin-bottom: 1rem; }
    .modern-banner h2 { font-size: 1.1rem; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }
    .modern-banner h1 { font-size: 2rem; color: var(--gold); text-transform: uppercase; margin: 0.2rem 0; font-weight: 800; }
    .modern-banner .event-title { font-size: 1.3rem; color: #fff; font-weight: bold; text-transform: uppercase; }
    .modern-banner .date-tag { display: inline-block; background: #334155; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.85rem; margin-top: 0.4rem; }

    /* Match Cards */
    .fights-grid { display: flex; flex-direction: column; gap: 0.6rem; }
    
    .fight-card { display: grid; grid-template-columns: 45px 1fr 1fr 45px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .fight-num-box { background: var(--gold); color: #000; font-weight: 900; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    
    .side-box { padding: 0.6rem 0.8rem; display: flex; flex-direction: column; justify-content: space-between; }
    .side-box.meron-side { border-left: 5px solid var(--meron); background: rgba(220, 38, 38, 0.08); }
    .side-box.wala-side { border-right: 5px solid var(--wala); background: rgba(2, 132, 199, 0.08); text-align: right; }
    
    .team-name { font-size: 1rem; font-weight: 800; text-transform: uppercase; color: #fff; }
    .owner-sub { font-size: 0.8rem; color: #94a3b8; font-style: italic; }
    .stats-line { display: flex; gap: 0.5rem; margin-top: 0.4rem; font-size: 0.8rem; font-weight: bold; }
    .wala-side .stats-line { justify-content: flex-end; }
    
    .badge-wt { background: #334155; padding: 0.15rem 0.4rem; border-radius: 4px; color: #fff; }
    .badge-band { background: #1e293b; border: 1px solid var(--border); padding: 0.15rem 0.4rem; border-radius: 4px; color: #cbd5e1; font-size: 0.75rem; }

    /* HIGH-DEFINITON PRINT ENGINE OPTIMIZATION */
    @media print { 
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      
      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print { display: none !important; } 
      .page-view { display: block !important; }
      #setupPage, #rosterPage { display: none !important; } 

      .modern-banner {
        border: 2px solid #000000 !important;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0.8rem !important;
        margin-bottom: 0.8rem !important;
        border-radius: 0 !important;
      }
      
      .modern-banner h1 { color: #000000 !important; font-size: 1.8rem !important; }
      .modern-banner h2, .modern-banner .event-title { color: #000000 !important; }
      .modern-banner .date-tag { background: none !important; border: 1px solid #000 !important; color: #000 !important; }

      .fights-grid { gap: 0.3rem !important; }

      .fight-card { 
        border: 1.5pt solid #000000 !important; 
        background: #ffffff !important; 
        color: #000000 !important; 
        page-break-inside: avoid !important;
        border-radius: 0 !important;
      }

      .fight-num-box { 
        background: #000000 !important; 
        color: #ffffff !important; 
        font-size: 1pt !important;
        font-weight: 900 !important;
      }

      .side-box.meron-side { 
        border-left: 6pt solid #dc2626 !important; 
        background: #ffffff !important; 
      }

      .side-box.wala-side { 
        border-right: 6pt solid #0284c7 !important; 
        background: #ffffff !important; 
      }

      .team-name { color: #000000 !important; font-size: 10pt !important; font-weight: 900 !important; }
      .owner-sub { color: #333333 !important; font-size: 8pt !important; }
      
      .badge-wt { 
        background: #000000 !important; 
        color: #ffffff !important; 
        font-size: 8pt !important;
        font-weight: bold !important;
      }

      .badge-band { 
        background: #ffffff !important; 
        border: 1pt solid #000000 !important; 
        color: #000000 !important; 
        font-size: 7.5pt !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="no-print" style="text-align: center; color: #38bdf8;">HD Matchmaker Program Generator</h1>

  <div class="page-nav no-print">
    <button class="page-btn active" onclick="switchPage('setupPage', event)">⚙️ Setup & Entry</button>
    <button class="page-btn" onclick="switchPage('rosterPage', event)">📋 Entry Roster (<span id="rosterBadgeCount">0</span>)</button>
    <button class="page-btn" onclick="switchPage('schedulePage', event)">📄 Print HD Program</button>
  </div>

  <!-- SETUP PAGE -->
  <div id="setupPage" class="page-view active card-panel no-print">
    <h2>1. Header Options</h2>
    <div class="form-group"><label>Arena / Venue Name</label><input type="text" id="eventArena" value="PASAY COCKPIT STADIUM"></div>
    <div class="form-group"><label>Promoter / Host</label><input type="text" id="eventPromoter" value="LUZON GAMEFOWL CHAMPIONS"></div>
    <div class="form-group"><label>Event Title</label><input type="text" id="eventTitle" value="5-COCK BIG EVENT DERBY"></div>
    <div class="form-group"><label>Date Display</label><input type="text" id="eventDate" value="SEPTEMBER 12, 2026"></div>

    <h2 style="margin-top:1.5rem;">2. Tournament Options</h2>
    <div class="form-group">
      <label>Derby Format</label>
      <select id="derbyFormat">
        <option value="2">2-Cock</option>
        <option value="3">3-Cock</option>
        <option value="4">4-Cock</option>
        <option value="5" selected>5-Cock</option>
        <option value="6">6-Cock</option>
      </select>
    </div>
    <div class="form-group"><label>Max Weight Gap (g)</label><input type="number" id="maxDiff" value="40"></div>

    <h2 style="margin-top:1.5rem;">3. Data Import</h2>
    <div class="form-group">
      <label>Format: Entry Name, Owner, Weight, LegBand, WingBand</label>
      <textarea id="bulkInput" rows="5" placeholder="ALPHA FARM, JOHN, 2150, 01, 10023&#10;BETA TEAM, MARK, 2140, 02, 10024"></textarea>
    </div>
    <button id="importTextBtn" class="btn">Import Entries</button>
    
    <div class="btn-group" style="margin-top:1.5rem;">
      <button id="generateBtn" class="btn btn-action" style="font-size: 1.1rem; padding: 0.8rem 1.5rem;">Generate HD Program</button>
    </div>
  </div>

  <!-- ROSTER PAGE -->
  <div id="rosterPage" class="page-view card-panel">
    <h2>Entry Roster (<span id="count">0</span> Birds)</h2>
    <table style="width:100%; border-collapse:collapse; margin-top:1rem;" id="rosterTable">
      <thead>
        <tr style="border-bottom: 2px solid var(--border); text-align: left;">
          <th style="padding:0.5rem;">#</th>
          <th>Entry</th>
          <th>Owner</th>
          <th>Weight</th>
          <th>LB</th>
          <th>WB</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PROGRAM PAGE -->
  <div id="schedulePage" class="page-view">
    <div class="no-print btn-group" style="margin-bottom: 1rem;">
      <button onclick="triggerHDPrint()" class="btn btn-print">🖨️ Print HD Program Sheet</button>
      <button id="exportCsvBtn" class="btn btn-csv">📥 Export CSV</button>
    </div>

    <!-- Printable Area -->
    <div class="modern-banner">
      <h2 id="dispArena">PASAY COCKPIT STADIUM</h2>
      <h1 id="dispPromoter">LUZON GAMEFOWL CHAMPIONS</h1>
      <div class="event-title" id="dispTitle">5-COCK BIG EVENT DERBY</div>
      <div class="date-tag" id="dispDate">SEPTEMBER 12, 2026</div>
    </div>

    <div class="fights-grid" id="fightsContainer"></div>
  </div>
</div>

<script>
  let entries = [];

  function switchPage(pageId, e) {
    document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.page-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (e) e.target.classList.add('active');
  }

  function triggerHDPrint() {
    window.print();
  }

  document.getElementById('importTextBtn').addEventListener('click', () => {
    const raw = document.getElementById('bulkInput').value.trim();
    if (!raw) return;
    raw.split('\n').forEach(line => {
      const parts = line.split(',');
      if (parts.length >= 3) {
        const entryName = parts[0].trim();
        const owner = parts[1].trim();
        const weight = parseInt(parts[2].trim());
        const lb = parts[3] ? parts[3].trim() : '';
        const wb = parts[4] ? parts[4].trim() : '';
        if (entryName && !isNaN(weight)) {
          entries.push({ id: Date.now() + Math.random(), entryName, owner, weight, lb, wb });
        }
      }
    });
    document.getElementById('bulkInput').value = '';
    renderRoster();
  });

  function renderRoster() {
    const tbody = document.querySelector('#rosterTable tbody');
    document.getElementById('count').textContent = entries.length;
    document.getElementById('rosterBadgeCount').textContent = entries.length;
    tbody.innerHTML = '';
    entries.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid var(--border)';
      tr.innerHTML = `
        <td style="padding:0.5rem;">${idx + 1}</td>
        <td><b>${item.entryName}</b></td>
        <td>${item.owner}</td>
        <td>${item.weight}g</td>
        <td>${item.lb || '-'}</td>
        <td>${item.wb || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('generateBtn').addEventListener('click', () => {
    document.getElementById('dispArena').textContent = document.getElementById('eventArena').value;
    document.getElementById('dispPromoter').textContent = document.getElementById('eventPromoter').value;
    document.getElementById('dispTitle').textContent = document.getElementById('eventTitle').value;
    document.getElementById('dispDate').textContent = document.getElementById('eventDate').value;

    const roundsCount = parseInt(document.getElementById('derbyFormat').value);
    const maxDiff = parseInt(document.getElementById('maxDiff').value) || 40;

    const entryGroups = {};
    entries.forEach(e => {
      if (!entryGroups[e.entryName]) entryGroups[e.entryName] = [];
      entryGroups[e.entryName].push(e);
    });

    const roundPools = Array.from({ length: roundsCount }, () => []);
    Object.keys(entryGroups).forEach(group => {
      const groupCocks = entryGroups[group].sort((a,b) => a.weight - b.weight);
      groupCocks.forEach((cock, index) => {
        const targetRound = index % roundsCount;
        roundPools[targetRound].push(cock);
      });
    });

    const allMatches = [];
    let globalFightNum = 1;
    const history = [];

    roundPools.forEach((rPool, rIndex) => {
      let pool = [...rPool].sort((a, b) => a.weight - b.weight);

      while (pool.length > 1) {
        const current = pool.shift();
        let bestIdx = -1;
        let minDiff = Infinity;

        for (let i = 0; i < pool.length; i++) {
          const candidate = pool[i];
          if (current.entryName.toLowerCase() === candidate.entryName.toLowerCase()) continue;

          const matchKey = [current.entryName.toLowerCase(), candidate.entryName.toLowerCase()].sort().join(' VS ');
          if (history.includes(matchKey)) continue;

          const diff = Math.abs(current.weight - candidate.weight);
          if (diff > maxDiff) break;

          if (diff < minDiff) {
            minDiff = diff;
            bestIdx = i;
          }
        }

        if (bestIdx !== -1) {
          const opponent = pool.splice(bestIdx, 1)[0];
          const matchKey = [current.entryName.toLowerCase(), opponent.entryName.toLowerCase()].sort().join(' VS ');
          history.push(matchKey);

          allMatches.push({
            num: globalFightNum++,
            round: rIndex + 1,
            meron: current,
            wala: opponent,
            diff: minDiff
          });
        }
      }
    });

    renderCards(allMatches);
    switchPage('schedulePage');
    document.querySelectorAll('.page-btn')[2].classList.add('active');
  });

  function renderCards(matches) {
    const container = document.getElementById('fightsContainer');
    container.innerHTML = '';

    matches.forEach(m => {
      const card = document.createElement('div');
      card.className = 'fight-card';
      card.innerHTML = `
        <div class="fight-num-box">#${m.num}</div>
        
        <div class="side-box meron-side">
          <div>
            <div class="team-name">${m.meron.entryName}</div>
            <div class="owner-sub">${m.meron.owner || ''}</div>
          </div>
          <div class="stats-line">
            <span class="badge-wt">${m.meron.weight}g</span>
            ${m.meron.lb ? `<span class="badge-band">LB: ${m.meron.lb}</span>` : ''}
            ${m.meron.wb ? `<span class="badge-band">WB: ${m.meron.wb}</span>` : ''}
          </div>
        </div>

        <div class="side-box wala-side">
          <div>
            <div class="team-name">${m.wala.entryName}</div>
            <div class="owner-sub">${m.wala.owner || ''}</div>
          </div>
          <div class="stats-line">
            ${m.wala.wb ? `<span class="badge-band">WB: ${m.wala.wb}</span>` : ''}
            ${m.wala.lb ? `<span class="badge-band">LB: ${m.wala.lb}</span>` : ''}
            <span class="badge-wt">${m.wala.weight}g</span>
          </div>
        </div>

        <div class="fight-num-box">#${m.num}</div>
      `;
      container.appendChild(card);
    });
  }
</script>

</body>
</html>
