<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Stream - All Providers</title>
    
    <!-- HLS.js library para sa streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            max-width: 960px;
            width: 100%;
        }
        h2 { color: #fff; text-align: center; margin-bottom: 5px; }
        .subtitle { color: #aaa; text-align: center; margin-bottom: 20px; font-size: 14px; }
        
        video {
            width: 100%;
            background: #000;
            border-radius: 12px;
            display: block;
            margin-bottom: 20px;
            max-height: 500px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .controls select, .controls input {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            background: #0f3460;
            color: #fff;
            min-width: 150px;
        }
        .controls select option { background: #1a1a2e; }
        .controls input::placeholder { color: #888; }
        
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover { background: #c73652; transform: scale(1.03); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        #logArea {
            background: #0f0f1f;
            color: #0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-badge { color: #ffd700; font-weight: bold; }
        .provider-info { color: #4fc3f7; font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Movie Stream Engine</h2>
    <p class="subtitle">⚡ <span class="status-badge">FETCH</span> mula sa Video Provider ➔ <span class="status-badge">INJECT</span> sa Player</p>

    <!-- Video Player -->
    <video id="myMoviePlayer" controls width="100%"></video>

    <!-- Controls with Provider Selector -->
    <div class="controls">
        <select id="providerSelect">
            <!-- Existing providers -->
            <option value="vidlink">Vidlink.pro</option>
            <option value="vidsrc">Vidsrc.net</option>
            <option value="vidsrc_cc">Vidsrc.cc</option>
            <option value="embed_su">Embed.su</option>
            <option value="2embed">2Embed</option>
            
            <!-- Previous new providers -->
            <option value="showbox">Showbox</option>
            <option value="febbox">FebBox (FedBox)</option>
            <option value="4khdhub">4KHDHub</option>
            <option value="videasy">Videasy</option>
            <option value="streamflix">StreamFlix</option>
            <option value="vaplayer">VaPlayer</option>
            <option value="zxcstreams">ZXCStreams</option>

            <!-- 🆕 BAGONG IDINAGDAG (galing sa screenshot) -->
            <option value="kisskh">kisskh</option>
            <option value="onetouchtv">onetouchtv</option>
            <option value="kkphim">kkphim</option>
        </select>
        
        <input type="text" id="movieIdInput" placeholder="Enter TMDB ID (e.g. 597 for Titanic)" value="597">
        
        <button id="loadBtn" onclick="fetchAndInjectStream()">🚀 I-Fetch at I-Inject</button>
        <button onclick="resetPlayer()" style="background:#555;">⏹ Reset</button>
    </div>

    <!-- Logs -->
    <div id="logArea">
        🔍 [System] Handa na. Pumili ng provider at mag-click ng button...
    </div>
    <div class="provider-info">💡 TMDB ID = The Movie Database ID ng pelikula (hal. 597 = Titanic)</div>
</div>

<script>
    // --- ELEMENTS ---
    let video = document.getElementById('myMoviePlayer');
    const log = document.getElementById('logArea');
    const loadBtn = document.getElementById('loadBtn');
    const providerSelect = document.getElementById('providerSelect');
    const movieIdInput = document.getElementById('movieIdInput');

    // --- HELPER: Add log ---
    function addLog(message, isError = false) {
        const timestamp = new Date().toLocaleTimeString();
        const prefix = isError ? '❌' : '✅';
        log.innerHTML += `\n[${timestamp}] ${prefix} ${message}`;
        log.scrollTop = log.scrollHeight;
        console.log(message);
    }

    // --- HELPER: Reset player ---
    function resetPlayer() {
        const currentPlayer = window.currentPlayer;
        if (currentPlayer && currentPlayer.tagName === 'IFRAME') {
            const newVideo = document.createElement('video');
            newVideo.id = 'myMoviePlayer';
            newVideo.controls = true;
            newVideo.width = '100%';
            newVideo.style.background = '#000';
            newVideo.style.borderRadius = '12px';
            newVideo.style.maxHeight = '500px';
            currentPlayer.parentNode.replaceChild(newVideo, currentPlayer);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
            addLog('🔄 Na-reset ang player (video tag na ulit).');
        } else {
            video.pause();
            video.currentTime = 0;
            video.src = '';
            addLog('🔄 Na-reset ang video player.');
        }
    }

    // --- PROVIDER CONFIGURATIONS ---
    const PROVIDERS = {
        // === EXISTING PROVIDERS ===
        vidlink: {
            name: 'Vidlink.pro',
            getStreamUrl: async (tmdbId) => {
                const url = `https://vidlink.pro/api/vidlink/watch?isMovie=true&id=${tmdbId}`;
                addLog(`🌐 [Vidlink] Tumatawag sa: ${url}`);
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.stream && data.stream.playlist) {
                    return data.stream.playlist;
                }
                throw new Error('Walang nakitang stream URL mula sa Vidlink');
            }
        },
        vidsrc: {
            name: 'Vidsrc.net',
            getStreamUrl: async (tmdbId) => {
                return `https://vidsrc.net/embed/movie/${tmdbId}`;
            }
        },
        vidsrc_cc: {
            name: 'Vidsrc.cc',
            getStreamUrl: async (tmdbId) => {
                return `https://vidsrc.cc/v2/embed/movie/${tmdbId}?poster=true&autoPlay=false`;
            }
        },
        embed_su: {
            name: 'Embed.su',
            getStreamUrl: async (tmdbId) => {
                return `https://embed.su/embed/movie/${tmdbId}`;
            }
        },
        '2embed': {
            name: '2Embed',
            getStreamUrl: async (tmdbId) => {
                return `https://www.2embed.cc/embed/movie/${tmdbId}`;
            }
        },

        // === PREVIOUS NEW PROVIDERS ===
        showbox: {
            name: 'Showbox',
            getStreamUrl: async (tmdbId) => {
                return `https://showbox.media/embed/movie/${tmdbId}`;
            }
        },
        febbox: {
            name: 'FebBox (FedBox)',
            getStreamUrl: async (tmdbId) => {
                return `https://febbox.com/embed/movie/${tmdbId}`;
            }
        },
        '4khdhub': {
            name: '4KHDHub',
            getStreamUrl: async (tmdbId) => {
                return `https://4khdhub.com/embed/movie/${tmdbId}`;
            }
        },
        videasy: {
            name: 'Videasy',
            getStreamUrl: async (tmdbId) => {
                return `https://videasy.net/embed/movie/${tmdbId}`;
            }
        },
        streamflix: {
            name: 'StreamFlix',
            getStreamUrl: async (tmdbId) => {
                return `https://streamflix.to/embed/movie/${tmdbId}`;
            }
        },
        vaplayer: {
            name: 'VaPlayer',
            getStreamUrl: async (tmdbId) => {
                return `https://vaplayer.xyz/embed/movie/${tmdbId}`;
            }
        },
        zxcstreams: {
            name: 'ZXCStreams',
            getStreamUrl: async (tmdbId) => {
                return `https://zxcstreams.com/embed/movie/${tmdbId}`;
            }
        },

        // === 🆕 BAGONG MGA PROVIDER (mula sa screenshot) ===
        kisskh: {
            name: 'kisskh',
            getStreamUrl: async (tmdbId) => {
                return `https://kisskh.co/movie/${tmdbId}`;
            }
        },
        onetouchtv: {
            name: 'onetouchtv',
            getStreamUrl: async (tmdbId) => {
                return `https://onetouchtv.com/embed/movie/${tmdbId}`;
            }
        },
        kkphim: {
            name: 'kkphim',
            getStreamUrl: async (tmdbId) => {
                return `https://kkphim.com/phim/${tmdbId}`;
            }
        }
    };

    // --- DETECT kung ang URL ay embed (iframe) ---
    function isEmbedUrl(url) {
        const embedPatterns = ['/embed/', 'vidsrc.cc', 'embed.su', '2embed.cc', 
                               'showbox.media', 'febbox.com', '4khdhub.com', 
                               'videasy.net', 'streamflix.to', 'vaplayer.xyz', 'zxcstreams.com',
                               // 🆕 Bagong patterns
                               'kisskh.co', 'onetouchtv.com', 'kkphim.com'];
        return embedPatterns.some(pattern => url.includes(pattern));
    }

    // --- INJECT via Iframe ---
    function injectIframe(embedUrl) {
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.width = '100%';
        iframe.height = '100%';
        iframe.style.border = 'none';
        iframe.allowFullscreen = true;
        iframe.allow = 'autoplay; encrypted-media; fullscreen';
        
        video.parentNode.replaceChild(iframe, video);
        window.currentPlayer = iframe;
        addLog('✅ [INJECT] Na-inject na ang iframe player!');
    }

    // --- INJECT via HLS.js ---
    function injectHLS(streamUrl) {
        const currentPlayer = window.currentPlayer;
        if (currentPlayer && currentPlayer.tagName === 'IFRAME') {
            const newVideo = document.createElement('video');
            newVideo.id = 'myMoviePlayer';
            newVideo.controls = true;
            newVideo.width = '100%';
            newVideo.style.background = '#000';
            newVideo.style.borderRadius = '12px';
            newVideo.style.maxHeight = '500px';
            currentPlayer.parentNode.replaceChild(newVideo, currentPlayer);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
        }

        if (Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            addLog('✅ [INJECT] Na-attach na ang HLS stream sa player!');

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                addLog('🎉 Handa na ang stream! Awtomatikong nagpe-play...');
                video.play().catch(e => addLog('⚠️ Hindi awtomatikong nag-play (kailangan ng user interaction).', true));
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    addLog(`💥 [ERROR] Fatal error sa stream: ${data.type}`, true);
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            addLog('🍎 Gumamit ng Native Safari HLS support.');
            video.play();
        } else {
            addLog('🚫 Hindi supported ng browser ang HLS streaming.', true);
        }
    }

    // --- CORE: FETCH + INJECT ---
    async function fetchAndInjectStream() {
        loadBtn.disabled = true;
        loadBtn.textContent = '⏳ Nagfa-fetch...';
        log.innerHTML = '';
        addLog('⚡ Nagsisimula ang proseso ng "Fetching Stream"...');

        const providerKey = providerSelect.value;
        const tmdbId = movieIdInput.value.trim();

        if (!tmdbId) {
            addLog('⚠️ Mangyaring maglagay ng TMDB ID (hal. 597)', true);
            loadBtn.disabled = false;
            loadBtn.textContent = '🚀 I-Fetch at I-Inject';
            return;
        }

        const provider = PROVIDERS[providerKey];
        if (!provider) {
            addLog(`⚠️ Hindi kilalang provider: ${providerKey}`, true);
            loadBtn.disabled = false;
            loadBtn.textContent = '🚀 I-Fetch at I-Inject';
            return;
        }

        try {
            addLog(`📡 Napiling Provider: ${provider.name}`);
            addLog(`🎬 TMDB ID: ${tmdbId}`);

            // --- STEP 1: FETCHING ---
            const streamUrl = await provider.getStreamUrl(tmdbId);
            addLog(`🔗 Nakuha ang URL: ${streamUrl.substring(0, 80)}...`);

            // --- STEP 2: INJECTING ---
            if (isEmbedUrl(streamUrl)) {
                addLog('🖼️ [INJECT] Embed URL detected - gumagamit ng iframe');
                injectIframe(streamUrl);
            } else if (streamUrl.endsWith('.m3u8') || streamUrl.includes('m3u8')) {
                addLog('📹 [INJECT] HLS Stream detected - gamit ang HLS.js');
                injectHLS(streamUrl);
            } else if (streamUrl.endsWith('.mp4')) {
                addLog('📹 [INJECT] Direct MP4 detected');
                video.src = streamUrl;
                video.play();
                addLog('🎉 Nagpe-play na ang MP4 video!');
            } else {
                addLog('🔄 [INJECT] Unknown format, sinusubukan bilang HLS...');
                injectHLS(streamUrl);
            }

        } catch (error) {
            addLog(`🔥 [ERROR] ${error.message}`, true);
            console.error(error);
        } finally {
            loadBtn.disabled = false;
            loadBtn.textContent = '🔄 I-Fetch ulit';
            addLog('🏁 Tapos na ang proseso.');
        }
    }

    // --- Event Listeners para sa video ---
    video.addEventListener('play', () => addLog('▶️ Nagpe-play ang video.'));
    video.addEventListener('pause', () => addLog('⏸️ Na-pause ang video.'));
    video.addEventListener('ended', () => addLog('⏹️ Tapos na ang movie.'));

    // --- Initial log ---
    addLog('💡 Pumili ng provider, maglagay ng TMDB ID, at i-click ang button.');
    addLog('📌 Kasama ngayon: kisskh, onetouchtv, at kkphim (gaya ng screenshot mo!)');
</script>
</body>
</html>
