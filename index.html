<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 900px; }
    h2 { text-align: center; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    select, button { padding: 12px; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 6px; font-size: 15px; }
    select { flex: 1; min-width: 180px; }
    button { cursor: pointer; background: #2a2a2a; }
    .player-box { width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    video { width: 100%; aspect-ratio: 16/9; display: block; }
    .status { margin-top: 10px; font-size: 14px; color: #00ff88; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>📺 Global IPTV Player</h2>

  <div class="controls">
    <select id="countrySelect" onchange="loadChannels()">
      <option value="ph" selected>🇵🇭 Philippines</option>
      <option value="us">🇺🇸 United States</option>
      <option value="gb">🇬🇧 United Kingdom</option>
      <option value="jp">🇯🇵 Japan</option>
    </select>

    <select id="channelSelect" onchange="playChannel()">
      <option value="">-- Select Channel --</option>
    </select>

    <button onclick="loadChannels()">🔄 Refresh</button>
  </div>

  <div class="player-box">
    <video id="video" controls autoplay playsinline></video>
  </div>
  
  <div id="status" class="status">Loading hidden streams...</div>
</div>

<script>
  // Ang iyong Cloudflare Worker URL
  const WORKER_BASE = 'https://iptv-proxy.22afed28-f0b2-46d0-8804-c90e25c90bd4.workers.dev';

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const countrySelect = document.getElementById('countrySelect');
  const channelSelect = document.getElementById('channelSelect');
  let hls = null;

  async function loadChannels() {
    const code = countrySelect.value;
    status.innerText = `Fetching protected channels...`;
    channelSelect.innerHTML = '<option value="">-- Loading... --</option>';

    try {
      // Hihingi lang tayo ng listahan mula sa Worker (Hidden Sources)
      const res = await fetch(`${WORKER_BASE}/?mode=get_channels&country=${code}`);
      const channels = await res.json();

      channelSelect.innerHTML = '<option value="">-- Select Channel --</option>';
      channels.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch.id; // Base64 ID lang ang nakalagay, walang URL!
        opt.innerText = ch.title;
        channelSelect.appendChild(opt);
      });

      status.innerText = `Channels Loaded (Sources Hidden)!`;
    } catch (e) {
      status.innerText = `Error loading channel list.`;
    }
  }

  function playChannel() {
    const streamId = channelSelect.value;
    if (!streamId) return;

    // Ang URL na tatawagin ng HTML5 video ay nakaturo LANG sa Worker ID
    const proxiedUrl = `${WORKER_BASE}/?id=${encodeURIComponent(streamId)}`;
    status.innerText = 'Connecting via Cloudflare Proxy...';

    if (hls) hls.destroy();

    if (Hls.isSupported()) {
      hls = new Hls({ enableWorker: true });
      hls.loadSource(proxiedUrl);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.innerText = 'Playing stream!';
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, () => {
        status.innerText = 'Stream offline or unreachable.';
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxiedUrl;
      video.play();
    }
  }

  window.onload = loadChannels;
</script>

</body>
</html>
