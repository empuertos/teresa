<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philippine Live IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    h2 { text-align: center; margin-bottom: 15px; }
    
    .controls {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    select {
      flex: 1;
      padding: 12px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 16px;
    }

    .player-box {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #00ff88;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🇵🇭 Philippine Live TV</h2>

  <!-- Philippine Channels Selection -->
  <div class="controls">
    <select id="channelSelect" onchange="playSelectedChannel()">
      <option value="">-- Pumili ng PH Channel --</option>
      <optgroup label="Local Channels">
        <option value="http://stream.cctn47.com/live/stream.m3u8">CCTN 47 (Cebu)</option>
        <option value="https://ebs-ebs.telepasion.tv/live/ebs/playlist.m3u8">EBS PH</option>
        <option value="https://untv.com.ph/live-stream/index.m3u8">UNTV News and Rescue</option>
        <option value="https://pTV.gov.ph/stream/live.m3u8">PTV 4 (Government)</option>
      </optgroup>
      <optgroup label="News & Sports">
        <option value="https://live.abs-cbn.com/hls/news/anc.m3u8">ANC (ABS-CBN News Channel)</option>
        <option value="https://dzrh.com.ph/live/stream.m3u8">DZRH News TV</option>
        <option value="https://oneph.com/stream/index.m3u8">One PH</option>
      </optgroup>
    </select>
  </div>

  <div class="player-box">
    <video id="video" controls autoplay playsinline></video>
  </div>
  
  <div id="status" class="status">Pumili ng channel para mag-start ang broadcast.</div>
</div>

<script>
  // Cloudflare Worker Proxy URL
  const PROXY = 'https://iptv-proxy.22afed28-f0b2-46d0-8804-c90e25c90bd4.workers.dev/?url=';

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const select = document.getElementById('channelSelect');
  let hls = null;

  function playSelectedChannel() {
    const rawUrl = select.value;
    if (!rawUrl) return;

    // Route target stream through Cloudflare Proxy
    const proxiedUrl = PROXY + encodeURIComponent(rawUrl);
    status.innerText = 'Kumokonekta sa channel...';

    if (hls) {
      hls.destroy();
    }

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(proxiedUrl);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.innerText = 'Gumagana na ang stream!';
        video.play().catch(() => {
          status.innerText = 'Pindutin ang Play button sa player.';
        });
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          status.innerText = 'Offline o Down ang napiling channel. Subukan ang iba.';
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxiedUrl;
      video.play();
    }
  }
</script>

</body>
</html>
