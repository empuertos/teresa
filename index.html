<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Stream Fetch + Inject - Full Demo</title>
    
    <!-- Import ng HLS.js library para suportahan ang streaming (.m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            max-width: 960px;
            width: 100%;
        }
        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 12px;
            display: block;
            margin-bottom: 20px;
            max-height: 500px;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.4);
        }
        button:hover {
            background: #c73652;
            transform: scale(1.03);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        #logArea {
            background: #0f0f1f;
            color: #0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status-badge {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Movie Stream Engine</h2>
    <p class="subtitle">⚡ <span class="status-badge">FETCH</span> mula sa Video Host ➔ <span class="status-badge">INJECT</span> sa Player</p>

    <!-- ITO ANG VIDEO PLAYER (Dito i-inject ang stream) -->
    <video id="myMoviePlayer" controls width="100%"></video>

    <div class="controls">
        <button id="loadBtn" onclick="fetchAndInjectStream()">🚀 I-Fetch at I-Inject ang Stream</button>
        <button onclick="document.getElementById('myMoviePlayer').pause(); document.getElementById('myMoviePlayer').currentTime=0;" style="background:#555;">⏹ Stop</button>
    </div>

    <!-- Dito lalabas ang real-time na technical logs -->
    <div id="logArea">
        🔍 [System] Handa na. Pindutin ang button para magsimula...
    </div>
</div>

<script>
    // --- ITO ANG CORE LOGIC NG FETCHING AT INJECTING ---
    
    // Elemento ng video player
    const video = document.getElementById('myMoviePlayer');
    const log = document.getElementById('logArea');
    const loadBtn = document.getElementById('loadBtn');

    // Helper function para mag-print ng logs sa screen (para makita ang proseso)
    function addLog(message, isError = false) {
        const timestamp = new Date().toLocaleTimeString();
        const prefix = isError ? '❌' : '✅';
        log.innerHTML += `\n[${timestamp}] ${prefix} ${message}`;
        log.scrollTop = log.scrollHeight; // Auto-scroll pababa
        console.log(message); // Sabay print sa browser console
    }

    // --- [PART 1] ANG "FETCHING" (Kumukuha ng Stream URL) ---
    // Ginaya natin ang tawag sa API ng video hosting provider (hal. VidSrc, Voeux, etc.)
    function mockApiCallToFetchStreamUrl() {
        addLog('🌐 [1. FETCHING] Tumatawag sa Video Hosting Provider API...');
        
        // Ito ang gumagaya sa paghihintay ng response mula sa internet (1.5 seconds)
        return new Promise((resolve) => {
            setTimeout(() => {
                // Sa totoong buhay, ito ang JSON na galing sa server ng provider.
                // Ginamit ko ang public test stream ng Mux para 100% gumana.
                const fakeApiResponse = {
                    status: "success",
                    movie_title: "Big Buck Bunny (Test Stream)",
                    stream_url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" // Actual working HLS stream
                };
                
                addLog(`📦 [1. FETCHING] Natanggap ang data mula sa API: ${fakeApiResponse.movie_title}`);
                resolve(fakeApiResponse.stream_url); // Ibinabalik nito ang URL ng video
            }, 1500); // Naghintay ng 1.5 sec para gayahin ang internet lag
        });
    }

    // --- [PART 2] ANG "INJECTING" (Isinaksak sa Video Player) ---
    async function fetchAndInjectStream() {
        // I-disable ang button habang naglo-load para iwas doble-click
        loadBtn.disabled = true;
        loadBtn.textContent = '⏳ Nagfa-fetch at nag-iinject...';
        log.innerHTML = ''; // Burahin lumang logs
        addLog('⚡ Nagsisimula ang proseso ng "Fetching Stream"...');

        try {
            // --- HAKBANG A: TUMAWAG SA API PARA KUMUHA NG VIDEO URL (FETCHING) ---
            const streamUrl = await mockApiCallToFetchStreamUrl();
            addLog(`🔗 [2. INJECTING] Natanggap ang Stream URL: ${streamUrl.substring(0, 50)}...`);

            // --- HAKBANG B: ISAKSAK (INJECT) ANG STREAM SA VIDEO PLAYER ---
            addLog('🛠️ [2. INJECTING] Sinisimulan ang pag-inject ng stream sa HTML5 Player...');

            // Check kung HLS (.m3u8) ang stream at supported ng browser
            if (Hls.isSupported()) {
                // Gumawa ng bagong HLS client
                const hls = new Hls({
                    enableWorker: true, // Para bumilis ang pag-load
                });

                // I-load ang na-fetch na stream URL
                hls.loadSource(streamUrl);
                
                // I-ATTACH (INJECT) ito sa ating video player element
                hls.attachMedia(video);
                
                addLog('✅ [2. INJECTING] Na-attach na ang stream sa video player!');

                // Kapag handa na ang video, i-play agad
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    addLog('🎉 [SUCCESS] Handa na ang stream! Awtomatikong nagpe-play...');
                    video.play().catch(e => addLog('⚠️ Hindi awtomatikong nag-play (kailangan ng user interaction).', true));
                });

                // Error handling ng HLS
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        addLog(`💥 [ERROR] Fatal error sa stream: ${data.type}`, true);
                    }
                });

            } 
            // Fallback para sa Safari (native ang HLS support nito)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                addLog('🍎 [2. INJECTING] Gumamit ng Native Safari HLS support.');
                video.play();
            } 
            else {
                // Kung hindi supported ang HLS, subukan i-play bilang normal na MP4 (kung .mp4 ang binigay)
                if (streamUrl.endsWith('.mp4')) {
                    video.src = streamUrl;
                    addLog('📹 [2. INJECTING] Direct MP4 file ang na-detect. Naglo-load na...');
                    video.play();
                } else {
                    addLog('🚫 [ERROR] Hindi supported ng iyong browser ang ganitong uri ng stream.', true);
                }
            }

        } catch (error) {
            // Kapag nag-error ang buong proseso (hal. nawalan ng internet)
            addLog(`🔥 [CRITICAL ERROR] May problema sa pag-fetch: ${error.message}`, true);
            console.error(error);
        } finally {
            // Ibalik ang button sa normal state
            loadBtn.disabled = false;
            loadBtn.textContent = '🔄 I-Fetch at I-Inject ulit';
            addLog('🏁 Tapos na ang proseso.');
        }
    }

    // Optional: Kapag na-click ang video mismo, magdagdag ng log
    video.addEventListener('play', () => addLog('▶️ Nagpe-play ang video.'));
    video.addEventListener('pause', () => addLog('⏸️ Na-pause ang video.'));
    video.addEventListener('ended', () => addLog('⏹️ Tapos na ang movie.'));

    // Magdagdag ng initial guide sa log
    addLog('💡 Pindutin ang "I-Fetch at I-Inject" para makita ang buong daloy.');
</script>

</body>
</html>
