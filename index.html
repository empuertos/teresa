<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal IPTV Player</title>
  <!-- HLS.js for .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- mpegts.js for raw MPEG-TS (.ts) and FLV live streams -->
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
  <style>
    body { background: #0b0d14; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .player-container { max-width: 900px; margin: 0 auto; background: #161922; border-radius: 12px; overflow: hidden; }
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; }
    .controls { padding: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222531; color: #fff; }
    input { flex: 1; min-width: 250px; }
    button { cursor: pointer; background: #0075ff; border: none; font-weight: bold; }
    .status { margin-top: 10px; font-size: 13px; color: #8a94a6; }
  </style>
</head>
<body>

<div class="player-container">
  <div class="video-wrapper">
    <video id="universalVideo" controls playsinline></video>
  </div>
  <div class="controls">
    <input type="text" id="streamUrl" placeholder="Paste stream URL (.m3u8, .ts, http/https)..." />
    <button id="loadBtn">Play Stream</button>
  </div>
  <div class="status" id="statusMessage">Ready. Enter stream URL.</div>
</div>

<script>
  const video = document.getElementById('universalVideo');
  const streamUrlInput = document.getElementById('streamUrl');
  const loadBtn = document.getElementById('loadBtn');
  const statusMsg = document.getElementById('statusMessage');

  let hlsEngine = null;
  let tsPlayer = null;

  // CORS Proxy service for streams blocked by origin headers
  const CORS_PROXY = 'https://corsproxy.io/?';

  function resetPlayers() {
    if (hlsEngine) { hlsEngine.destroy(); hlsEngine = null; }
    if (tsPlayer) { tsPlayer.destroy(); tsPlayer = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
  }

  function playUniversalStream(rawUrl, useProxy = false) {
    resetPlayers();

    const targetUrl = useProxy ? CORS_PROXY + encodeURIComponent(rawUrl) : rawUrl;
    statusMsg.textContent = `Loading: ${targetUrl}`;

    // 1. Detect MPEG-TS (.ts) or FLV Streams
    if (rawUrl.includes('.ts') || rawUrl.includes('.flv') || mpegts.isSupported()) {
      if (mpegts.isSupported()) {
        tsPlayer = mpegts.createPlayer({
          type: rawUrl.includes('.flv') ? 'flv' : 'mse',
          isLive: true,
          url: targetUrl
        });
        tsPlayer.attachMediaElement(video);
        tsPlayer.load();
        tsPlayer.play().then(() => {
          statusMsg.textContent = 'Playing via MPEG-TS Engine';
        }).catch(() => tryFallback(rawUrl, useProxy));
        return;
      }
    }

    // 2. Detect HLS (.m3u8) Streams
    if (Hls.isSupported()) {
      hlsEngine = new Hls({ enableWorker: true, lowLatencyMode: true });
      hlsEngine.loadSource(targetUrl);
      hlsEngine.attachMedia(video);
      hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play();
        statusMsg.textContent = 'Playing via HLS Engine';
      });
      hlsEngine.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal && !useProxy) {
          statusMsg.textContent = 'Direct connection blocked by CORS. Retrying via Proxy...';
          tryFallback(rawUrl, useProxy);
        }
      });
      return;
    }

    // 3. Native MP4 / Safari HLS Fallback
    if (video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('video/mp4')) {
      video.src = targetUrl;
      video.play().catch(() => tryFallback(rawUrl, useProxy));
    }
  }

  function tryFallback(rawUrl, currentlyUsingProxy) {
    if (!currentlyUsingProxy) {
      playUniversalStream(rawUrl, true);
    } else {
      statusMsg.textContent = 'Failed to load stream. Server may be offline or strictly blocking web clients.';
    }
  }

  loadBtn.onclick = () => {
    const url = streamUrlInput.value.trim();
    if (url) playUniversalStream(url);
  };
</script>

</body>
</html>
