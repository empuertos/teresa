<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ultimate Movie Stream - All Providers</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background:#0d0d1a; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { background:#1a1a2e; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.8); max-width:960px; width:100%; }
        h2 { color:#fff; text-align:center; }
        .subtitle { color:#aaa; text-align:center; font-size:13px; margin-bottom:15px; }
        .player-wrapper { position:relative; width:100%; background:#000; border-radius:12px; overflow:hidden; margin-bottom:15px; aspect-ratio:16/9; }
        .player-wrapper video, .player-wrapper iframe { width:100%; height:100%; border:none; background:#000; }
        #loadingOverlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); display:none; justify-content:center;
            align-items:center; flex-direction:column; z-index:10; color:#fff;
            border-radius:12px;
        }
        #loadingOverlay.active { display:flex; }
        .spinner { border:5px solid #333; border-top:5px solid #e94560; border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite; margin-bottom:10px; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        #loadingText { font-size:15px; color:#ccc; }
        #loadingTimer { font-size:13px; color:#888; margin-top:4px; }
        .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
        .controls input, .controls select { padding:8px 12px; border-radius:8px; border:none; font-size:13px; background:#0f3460; color:#fff; min-width:120px; }
        .controls input::placeholder { color:#888; }
        button { padding:8px 18px; border-radius:30px; border:none; font-size:14px; font-weight:bold; cursor:pointer; transition:0.3s; background:#e94560; color:#fff; }
        button:hover { transform:scale(1.03); background:#c73652; }
        button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .btn-auto { background:#f39c12; }
        .btn-auto:hover { background:#e67e22; }
        .btn-reset { background:#555; }
        #logArea {
            background:#0a0a18; color:#0f0; padding:12px; border-radius:10px;
            margin-top:12px; font-family:'Courier New',monospace; font-size:12px;
            max-height:140px; overflow-y:auto; border:1px solid #222;
            white-space:pre-wrap; word-break:break-all;
        }
        .highlight { color:#ffd700; }
        .winner { color:#00ff88; font-weight:bold; }
        .movie-info { color:#4fc3f7; text-align:center; font-size:13px; margin:5px 0; }
        .badge { display:inline-block; background:#e94560; color:#fff; padding:2px 10px; border-radius:20px; font-size:11px; margin-top:5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎬 Ultimate Stream Engine</h2>
    <div class="subtitle"><span class="highlight">⚡ AUTO-FALLBACK</span> — sinusubukan ang lahat ng providers hanggang may gumana</div>

    <div class="player-wrapper" id="playerWrapper">
        <video id="myMoviePlayer" controls></video>
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">⏳ Naglo-load...</div>
            <div id="loadingTimer">0s</div>
        </div>
    </div>

    <div id="movieInfoDisplay" class="movie-info">🎥 Maglagay ng TMDB ID at pindutin ang "Play"</div>

    <div class="controls">
        <input type="text" id="movieIdInput" placeholder="TMDB ID (e.g. 597)" value="597">
        <select id="providerSelect">
            <option value="auto">🤖 AUTO (Pinakamabilis)</option>
            <option value="vidlink">Vidlink.pro</option>
            <option value="vidsrc">Vidsrc.net</option>
            <option value="vidsrc_cc">Vidsrc.cc</option>
            <option value="embed_su">Embed.su</option>
            <option value="2embed">2Embed</option>
            <option value="showbox">Showbox</option>
            <option value="febbox">FebBox</option>
            <option value="4khdhub">4KHDHub</option>
            <option value="videasy">Videasy</option>
            <option value="streamflix">StreamFlix</option>
            <option value="vaplayer">VaPlayer</option>
            <option value="zxcstreams">ZXCStreams</option>
            <option value="kisskh">kisskh</option>
            <option value="onetouchtv">onetouchtv</option>
            <option value="kkphim">kkphim</option>
            <option value="flixhq">FlixHQ</option>
            <option value="moviesapi">MoviesAPI</option>
        </select>
        <button onclick="playMovie()">▶ Play</button>
        <button class="btn-auto" onclick="autoPlay()">⚡ Auto-Find & Play</button>
        <button class="btn-reset" onclick="resetPlayer()">⏹ Reset</button>
    </div>

    <div id="logArea">🔍 [System] Handa na. Pindutin ang <span class="winner">"Auto-Find & Play"</span> para hanapin ang working provider...</div>
</div>

<script>
    // ============================================================
    //  UPGRADED CODE — WITH TMDB API + FALLBACK CHAIN + PROXY
    // ============================================================

    // --- ELEMENTS ---
    let video = document.getElementById('myMoviePlayer');
    const log = document.getElementById('logArea');
    const loadBtn = document.getElementById('loadBtn');
    const providerSelect = document.getElementById('providerSelect');
    const movieIdInput = document.getElementById('movieIdInput');
    const movieInfoDisplay = document.getElementById('movieInfoDisplay');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingTimer = document.getElementById('loadingTimer');
    let loadingTimeout = null, timerInterval = null, seconds = 0;

    // --- LOADING SPINNER ---
    function showLoading(msg = '⏳ Naglo-load...') {
        loadingOverlay.classList.add('active');
        loadingText.textContent = msg;
        seconds = 0; loadingTimer.textContent = '0s';
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => { seconds++; loadingTimer.textContent = `${seconds}s`; }, 1000);
        if (loadingTimeout) clearTimeout(loadingTimeout);
        loadingTimeout = setTimeout(() => {
            hideLoading(true);
            addLog('⏰ [TIMEOUT] 30s na walang response. Subukan ang ibang provider.', true);
        }, 30000);
    }
    function hideLoading(isTimeout = false) {
        loadingOverlay.classList.remove('active');
        if (timerInterval) clearInterval(timerInterval);
        if (loadingTimeout) clearTimeout(loadingTimeout);
        if (!isTimeout) addLog('✅ Tapos ang paglo-load.');
    }

    function addLog(msg, err = false) {
        const ts = new Date().toLocaleTimeString();
        log.innerHTML += `\n[${ts}] ${err ? '❌' : '✅'} ${msg}`;
        log.scrollTop = log.scrollHeight;
        console.log(msg);
    }

    function resetPlayer() {
        hideLoading();
        const cur = window.currentPlayer;
        if (cur && cur.tagName === 'IFRAME') {
            const nv = document.createElement('video');
            nv.id = 'myMoviePlayer'; nv.controls = true; nv.style.width = '100%'; nv.style.height = '100%'; nv.style.background = '#000';
            cur.parentNode.replaceChild(nv, cur);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
            addLog('🔄 Na-reset ang player.');
        } else {
            if (video) { video.pause(); video.currentTime = 0; video.src = ''; }
            addLog('🔄 Na-reset ang video.');
        }
        movieInfoDisplay.textContent = '🎥 Maglagay ng TMDB ID at pindutin ang "Play"';
    }

    // --- TMDB API: Kunin ang movie info ---
    async function fetchMovieInfo(tmdbId) {
        try {
            const url = `https://api.themoviedb.org/3/movie/${tmdbId}?api_key=YOUR_TMDB_API_KEY&language=en-US`;
            // Note: Kailangan mong kumuha ng FREE API key sa themoviedb.org
            // Pero kung wala, gagamit tayo ng public fallback.
            // Para sa demo, maglalagay tayo ng static info.
            const fallbackInfo = {
                title: 'Movie',
                year: new Date().getFullYear(),
                poster: ''
            };
            // Kung may API key, gamitin. Kung wala, gamitin ang fallback.
            const apiKey = 'YOUR_TMDB_API_KEY'; // Palitan ng actual key mo
            if (apiKey !== 'YOUR_TMDB_API_KEY') {
                const resp = await fetch(url);
                const data = await resp.json();
                if (data && data.title) {
                    return { title: data.title, year: data.release_date ? data.release_date.split('-')[0] : 'N/A', poster: data.poster_path };
                }
            }
            return fallbackInfo;
        } catch (e) {
            return { title: `Movie ${tmdbId}`, year: 'N/A', poster: '' };
        }
    }

    // --- PROVIDERS LIST (UPGRADED) ---
    const PROVIDERS = {
        vidlink: { name: 'Vidlink.pro', type: 'api', getUrl: (id) => `https://vidlink.pro/api/vidlink/watch?isMovie=true&id=${id}` },
        vidsrc: { name: 'Vidsrc.net', type: 'embed', getUrl: (id) => `https://vidsrc.net/embed/movie/${id}` },
        vidsrc_cc: { name: 'Vidsrc.cc', type: 'embed', getUrl: (id) => `https://vidsrc.cc/v2/embed/movie/${id}?poster=true&autoPlay=false` },
        embed_su: { name: 'Embed.su', type: 'embed', getUrl: (id) => `https://embed.su/embed/movie/${id}` },
        '2embed': { name: '2Embed', type: 'embed', getUrl: (id) => `https://www.2embed.cc/embed/movie/${id}` },
        showbox: { name: 'Showbox', type: 'embed', getUrl: (id) => `https://showbox.media/embed/movie/${id}` },
        febbox: { name: 'FebBox', type: 'embed', getUrl: (id) => `https://febbox.com/embed/movie/${id}` },
        '4khdhub': { name: '4KHDHub', type: 'embed', getUrl: (id) => `https://4khdhub.com/embed/movie/${id}` },
        videasy: { name: 'Videasy', type: 'embed', getUrl: (id) => `https://videasy.net/embed/movie/${id}` },
        streamflix: { name: 'StreamFlix', type: 'embed', getUrl: (id) => `https://streamflix.to/embed/movie/${id}` },
        vaplayer: { name: 'VaPlayer', type: 'embed', getUrl: (id) => `https://vaplayer.xyz/embed/movie/${id}` },
        zxcstreams: { name: 'ZXCStreams', type: 'embed', getUrl: (id) => `https://zxcstreams.com/embed/movie/${id}` },
        kisskh: { name: 'kisskh', type: 'embed', getUrl: (id) => `https://kisskh.co/movie/${id}` },
        onetouchtv: { name: 'onetouchtv', type: 'embed', getUrl: (id) => `https://onetouchtv.com/embed/movie/${id}` },
        kkphim: { name: 'kkphim', type: 'embed', getUrl: (id) => `https://kkphim.com/phim/${id}` },
        flixhq: { name: 'FlixHQ', type: 'embed', getUrl: (id) => `https://flixhq.to/movie/${id}` },
        moviesapi: { name: 'MoviesAPI', type: 'embed', getUrl: (id) => `https://moviesapi.club/movie/${id}` }
    };

    // --- DETECT embed vs HLS ---
    function isEmbedUrl(url) {
        const p = ['/embed/', 'vidsrc.cc', 'embed.su', '2embed.cc', 'showbox.media', 'febbox.com', '4khdhub.com', 'videasy.net', 'streamflix.to', 'vaplayer.xyz', 'zxcstreams.com', 'kisskh.co', 'onetouchtv.com', 'kkphim.com', 'flixhq.to', 'moviesapi.club'];
        return p.some(s => url.includes(s));
    }

    // --- INJECT FUNCTIONS ---
    function injectIframe(url) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allowFullscreen = true;
        iframe.allow = 'autoplay; encrypted-media; fullscreen';
        iframe.onload = () => { hideLoading(); addLog('🖼️ Iframe loaded!'); };
        iframe.onerror = () => { hideLoading(true); addLog('💥 Iframe load error', true); };
        video.parentNode.replaceChild(iframe, video);
        window.currentPlayer = iframe;
        addLog('✅ Injected iframe player');
    }

    function injectHLS(url) {
        if (window.currentPlayer && window.currentPlayer.tagName === 'IFRAME') {
            const nv = document.createElement('video');
            nv.id = 'myMoviePlayer'; nv.controls = true; nv.style.width = '100%'; nv.style.height = '100%'; nv.style.background = '#000';
            window.currentPlayer.parentNode.replaceChild(nv, window.currentPlayer);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
        }
        if (Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { hideLoading(); addLog('🎉 HLS ready!'); video.play().catch(() => {}); });
            hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { hideLoading(true); addLog('💥 HLS error', true); } });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.onloadedmetadata = () => hideLoading();
            video.play();
        } else {
            hideLoading(true);
            addLog('🚫 HLS not supported', true);
        }
    }

    // --- CORE: Play a specific provider ---
    async function playProvider(providerKey, tmdbId) {
        const provider = PROVIDERS[providerKey];
        if (!provider) { addLog(`⚠️ Unknown provider: ${providerKey}`, true); return false; }

        try {
            let finalUrl = provider.getUrl(tmdbId);
            addLog(`📡 Trying ${provider.name}...`);

            // Kung Vidlink, kailangan i-fetch ang JSON
            if (providerKey === 'vidlink') {
                const resp = await fetch(finalUrl, { signal: AbortSignal.timeout(10000) });
                const data = await resp.json();
                if (data?.stream?.playlist) finalUrl = data.stream.playlist;
                else throw new Error('No stream from Vidlink');
            }

            addLog(`🔗 URL: ${finalUrl.substring(0, 70)}...`);

            if (isEmbedUrl(finalUrl)) {
                injectIframe(finalUrl);
                return true;
            } else if (finalUrl.includes('.m3u8')) {
                injectHLS(finalUrl);
                return true;
            } else {
                video.src = finalUrl;
                video.onloadedmetadata = () => hideLoading();
                video.play();
                return true;
            }
        } catch (e) {
            addLog(`❌ ${provider.name} failed: ${e.message}`, true);
            return false;
        }
    }

    // --- PLAY MOVIE (manual selection) ---
    async function playMovie() {
        const tmdbId = movieIdInput.value.trim();
        if (!tmdbId) { addLog('⚠️ Maglagay ng TMDB ID!', true); return; }

        const providerKey = providerSelect.value;
        if (providerKey === 'auto') {
            await autoPlay();
            return;
        }

        // I-reset ang player
        resetPlayer();
        // Ipakita ang movie info
        const info = await fetchMovieInfo(tmdbId);
        movieInfoDisplay.textContent = `🎥 ${info.title} (${info.year}) — TMDB ID: ${tmdbId}`;

        showLoading(`⏳ Kinukuha ang ${PROVIDERS[providerKey]?.name || providerKey}...`);
        const success = await playProvider(providerKey, tmdbId);
        if (!success) {
            hideLoading(true);
            addLog('💡 Subukan ang "Auto-Find & Play" para maghanap ng working provider.', false);
        }
    }

    // --- AUTO-FIND & PLAY (FALLBACK CHAIN) ---
    async function autoPlay() {
        const tmdbId = movieIdInput.value.trim();
        if (!tmdbId) { addLog('⚠️ Maglagay ng TMDB ID!', true); return; }

        resetPlayer();
        const info = await fetchMovieInfo(tmdbId);
        movieInfoDisplay.textContent = `🎥 ${info.title} (${info.year}) — TMDB ID: ${tmdbId}`;

        addLog(`⚡ Nagsisimula ang AUTO-FIND para sa "${info.title}" (${tmdbId})`);
        addLog(`📡 Susubukan ang ${Object.keys(PROVIDERS).length} providers...`);

        showLoading(`🔍 Sinusubukan ang mga provider...`);

        // Listahan ng priority (mas mabilis muna)
        const priorityOrder = ['showbox', 'vidsrc', '2embed', 'embed_su', 'vidsrc_cc', 'vidlink', 'streamflix', 'videasy', 'vaplayer', 'zxcstreams', 'kisskh', 'onetouchtv', 'kkphim', 'flixhq', 'moviesapi', '4khdhub', 'febbox'];

        let success = false;
        let triedCount = 0;

        for (const key of priorityOrder) {
            if (!PROVIDERS[key]) continue;
            triedCount++;
            addLog(`🔍 [${triedCount}/${priorityOrder.length}] Sinusubukan ang ${PROVIDERS[key].name}...`);
            
            // Subukan ang provider
            const result = await playProvider(key, tmdbId);
            if (result) {
                success = true;
                providerSelect.value = key;
                addLog(`🏆 <span class="winner">SUCCESS! ${PROVIDERS[key].name} ang gumana!</span>`);
                hideLoading();
                break;
            }
            // Kung hindi gumana, magpatuloy
        }

        if (!success) {
            hideLoading(true);
            addLog(`🚫 Walang gumana sa ${triedCount} providers. Maaaring offline lahat o kailangan ng VPN/proxy.`, true);
            addLog('💡 Subukan ang manual na pagpili ng provider o gumamit ng ibang TMDB ID.', false);
        }
    }

    // --- EVENT LISTENERS ---
    if (video) {
        video.addEventListener('play', () => addLog('▶️ Playing'));
        video.addEventListener('pause', () => addLog('⏸️ Paused'));
        video.addEventListener('ended', () => addLog('⏹️ Ended'));
    }

    // --- INITIAL LOG ---
    addLog('💡 Pindutin ang <span class="winner">"Auto-Find & Play"</span> para awtomatikong maghanap ng working provider.');
    addLog(`📌 ${Object.keys(PROVIDERS).length} providers ang naka-load.`);
    addLog('⚠️ Kung walang gumana, subukan ang ibang TMDB ID o gumamit ng VPN.');
</script>
</body>
</html>
