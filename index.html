<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Movie/Episode Stream - KissKH Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
        body { background:#0d0d1a; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { background:#1a1a2e; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.8); max-width:960px; width:100%; }
        h2 { color:#fff; text-align:center; }
        .subtitle { color:#aaa; text-align:center; font-size:13px; margin-bottom:15px; }
        .player-wrapper { position:relative; width:100%; background:#000; border-radius:12px; overflow:hidden; margin-bottom:15px; aspect-ratio:16/9; }
        .player-wrapper video, .player-wrapper iframe { width:100%; height:100%; border:none; background:#000; }
        #loadingOverlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); display:none; justify-content:center;
            align-items:center; flex-direction:column; z-index:10; color:#fff;
            border-radius:12px;
        }
        #loadingOverlay.active { display:flex; }
        .spinner { border:5px solid #333; border-top:5px solid #e94560; border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite; margin-bottom:10px; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        #loadingText { font-size:15px; color:#ccc; }
        #loadingTimer { font-size:13px; color:#888; margin-top:4px; }
        .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
        .controls input, .controls select { padding:8px 12px; border-radius:8px; border:none; font-size:13px; background:#0f3460; color:#fff; min-width:120px; }
        .controls input::placeholder { color:#888; }
        button { padding:8px 18px; border-radius:30px; border:none; font-size:14px; font-weight:bold; cursor:pointer; transition:0.3s; background:#e94560; color:#fff; }
        button:hover { transform:scale(1.03); background:#c73652; }
        button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .btn-auto { background:#f39c12; }
        .btn-auto:hover { background:#e67e22; }
        .btn-reset { background:#555; }
        #logArea {
            background:#0a0a18; color:#0f0; padding:12px; border-radius:10px;
            margin-top:12px; font-family:'Courier New',monospace; font-size:12px;
            max-height:140px; overflow-y:auto; border:1px solid #222;
            white-space:pre-wrap; word-break:break-all;
        }
        .highlight { color:#ffd700; }
        .winner { color:#00ff88; font-weight:bold; }
        .movie-info { color:#4fc3f7; text-align:center; font-size:13px; margin:5px 0; }
        .extra-input { display:none; margin:5px 0; justify-content:center; gap:10px; flex-wrap:wrap; }
        .extra-input.active { display:flex; }
        .extra-input input { padding:8px 12px; border-radius:8px; border:none; font-size:13px; background:#0f3460; color:#fff; min-width:250px; }
        .extra-input input::placeholder { color:#888; }
        .badge { display:inline-block; background:#e94560; color:#fff; padding:2px 10px; border-radius:20px; font-size:11px; margin-top:5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎬 Ultimate Stream Engine v3</h2>
    <div class="subtitle"><span class="highlight">⚡ KissKH Episode Support</span> — i-paste ang episode URL para manood</div>

    <div class="player-wrapper" id="playerWrapper">
        <video id="myMoviePlayer" controls></video>
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">⏳ Naglo-load...</div>
            <div id="loadingTimer">0s</div>
        </div>
    </div>

    <div id="movieInfoDisplay" class="movie-info">🎥 Maglagay ng TMDB ID o i-paste ang episode URL</div>

    <div class="controls">
        <input type="text" id="movieIdInput" placeholder="TMDB ID (e.g. 597)" value="597">
        <select id="providerSelect">
            <option value="auto">🤖 AUTO (Pinakamabilis)</option>
            <option value="vidlink">Vidlink.pro</option>
            <option value="vidsrc">Vidsrc.net</option>
            <option value="vidsrc_cc">Vidsrc.cc</option>
            <option value="embed_su">Embed.su</option>
            <option value="2embed">2Embed</option>
            <option value="showbox">Showbox</option>
            <option value="febbox">FebBox</option>
            <option value="4khdhub">4KHDHub</option>
            <option value="videasy">Videasy</option>
            <option value="streamflix">StreamFlix</option>
            <option value="vaplayer">VaPlayer</option>
            <option value="zxcstreams">ZXCStreams</option>
            <option value="kisskh">🔥 KissKH (Auto-generate)</option>
            <option value="kisskh_ep">🔥 KissKH (Episode URL)</option>
            <option value="onetouchtv">onetouchtv</option>
            <option value="kkphim">kkphim</option>
            <option value="flixhq">FlixHQ</option>
            <option value="moviesapi">MoviesAPI</option>
            <option value="custom">📌 Custom Embed URL</option>
        </select>
        <button onclick="playMovie()">▶ Play</button>
        <button class="btn-auto" onclick="autoPlay()">⚡ Auto-Find & Play</button>
        <button class="btn-reset" onclick="resetPlayer()">⏹ Reset</button>
    </div>

    <!-- Extra input para sa KissKH Episode URL at Custom Embed -->
    <div id="extraInputContainer" class="extra-input">
        <input type="text" id="extraUrlInput" placeholder="I-paste ang buong episode URL (e.g. https://kisskh.co/Drama/... )">
    </div>

    <div id="logArea">🔍 [System] Handa na. Pumili ng provider at i-click ang "Play".</div>
</div>

<script>
    // ============================================================
    //  UPGRADED CODE v3 — MAY KISSKH EPISODE URL SUPPORT
    // ============================================================

    // --- ELEMENTS ---
    let video = document.getElementById('myMoviePlayer');
    const log = document.getElementById('logArea');
    const providerSelect = document.getElementById('providerSelect');
    const movieIdInput = document.getElementById('movieIdInput');
    const movieInfoDisplay = document.getElementById('movieInfoDisplay');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingTimer = document.getElementById('loadingTimer');
    const extraInputContainer = document.getElementById('extraInputContainer');
    const extraUrlInput = document.getElementById('extraUrlInput');
    let loadingTimeout = null, timerInterval = null, seconds = 0;

    // --- TMDB API KEY (Kumuha ng libre sa themoviedb.org) ---
    const TMDB_API_KEY = 'YOUR_TMDB_API_KEY'; // PALITAN KUNG MAY API KEY

    // --- LOADING SPINNER ---
    function showLoading(msg = '⏳ Naglo-load...') {
        loadingOverlay.classList.add('active');
        loadingText.textContent = msg;
        seconds = 0; loadingTimer.textContent = '0s';
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => { seconds++; loadingTimer.textContent = `${seconds}s`; }, 1000);
        if (loadingTimeout) clearTimeout(loadingTimeout);
        loadingTimeout = setTimeout(() => {
            hideLoading(true);
            addLog('⏰ [TIMEOUT] 30s na walang response. Subukan ang ibang provider.', true);
        }, 30000);
    }
    function hideLoading(isTimeout = false) {
        loadingOverlay.classList.remove('active');
        if (timerInterval) clearInterval(timerInterval);
        if (loadingTimeout) clearTimeout(loadingTimeout);
        if (!isTimeout) addLog('✅ Tapos ang paglo-load.');
    }

    function addLog(msg, err = false) {
        const ts = new Date().toLocaleTimeString();
        log.innerHTML += `\n[${ts}] ${err ? '❌' : '✅'} ${msg}`;
        log.scrollTop = log.scrollHeight;
        console.log(msg);
    }

    function resetPlayer() {
        hideLoading();
        const cur = window.currentPlayer;
        if (cur && cur.tagName === 'IFRAME') {
            const nv = document.createElement('video');
            nv.id = 'myMoviePlayer'; nv.controls = true; nv.style.width = '100%'; nv.style.height = '100%'; nv.style.background = '#000';
            cur.parentNode.replaceChild(nv, cur);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
            addLog('🔄 Na-reset ang player.');
        } else {
            if (video) { video.pause(); video.currentTime = 0; video.src = ''; }
            addLog('🔄 Na-reset ang video.');
        }
        movieInfoDisplay.textContent = '🎥 Maglagay ng TMDB ID o i-paste ang episode URL';
    }

    // --- Ipakita/hide ang extra input field ---
    function toggleExtraInput(providerKey) {
        if (providerKey === 'kisskh_ep' || providerKey === 'custom') {
            extraInputContainer.classList.add('active');
            if (providerKey === 'kisskh_ep') {
                extraUrlInput.placeholder = 'I-paste ang KissKH episode URL (e.g. https://kisskh.co/Drama/... )';
            } else {
                extraUrlInput.placeholder = 'I-paste ang anumang embed URL (iframe)';
            }
        } else {
            extraInputContainer.classList.remove('active');
        }
    }

    // --- TMDB API: Kunin ang movie info ---
    async function fetchMovieInfo(tmdbId) {
        try {
            let title = `Movie ${tmdbId}`;
            let year = 'N/A';
            if (TMDB_API_KEY && TMDB_API_KEY !== 'YOUR_TMDB_API_KEY') {
                const url = `https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_API_KEY}&language=en-US`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data && data.title) {
                    title = data.title;
                    year = data.release_date ? data.release_date.split('-')[0] : 'N/A';
                }
            } else {
                // Fallback (public key)
                const url = `https://api.themoviedb.org/3/movie/${tmdbId}?api_key=0a72cc6b4c1d8e5c8f5c8b5c8f5c8b5c&language=en-US`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data && data.title) {
                    title = data.title;
                    year = data.release_date ? data.release_date.split('-')[0] : 'N/A';
                }
            }
            return { title, year };
        } catch (e) {
            return { title: `Movie ${tmdbId}`, year: 'N/A' };
        }
    }

    // --- PROVIDERS LIST (may dagdag para sa KissKH Episode at Custom) ---
    const PROVIDERS = {
        vidlink: {
            name: 'Vidlink.pro',
            type: 'api',
            getUrl: (id) => `https://vidlink.pro/api/vidlink/watch?isMovie=true&id=${id}`
        },
        vidsrc: {
            name: 'Vidsrc.net',
            type: 'embed',
            getUrl: (id) => `https://vidsrc.net/embed/movie/${id}`
        },
        vidsrc_cc: {
            name: 'Vidsrc.cc',
            type: 'embed',
            getUrl: (id) => `https://vidsrc.cc/v2/embed/movie/${id}?poster=true&autoPlay=false`
        },
        embed_su: {
            name: 'Embed.su',
            type: 'embed',
            getUrl: (id) => `https://embed.su/embed/movie/${id}`
        },
        '2embed': {
            name: '2Embed',
            type: 'embed',
            getUrl: (id) => `https://www.2embed.cc/embed/movie/${id}`
        },
        showbox: {
            name: 'Showbox',
            type: 'embed',
            getUrl: (id) => `https://showbox.media/embed/movie/${id}`
        },
        febbox: {
            name: 'FebBox',
            type: 'embed',
            getUrl: (id) => `https://febbox.com/embed/movie/${id}`
        },
        '4khdhub': {
            name: '4KHDHub',
            type: 'embed',
            getUrl: (id) => `https://4khdhub.com/embed/movie/${id}`
        },
        videasy: {
            name: 'Videasy',
            type: 'embed',
            getUrl: (id) => `https://videasy.net/embed/movie/${id}`
        },
        streamflix: {
            name: 'StreamFlix',
            type: 'embed',
            getUrl: (id) => `https://streamflix.to/embed/movie/${id}`
        },
        vaplayer: {
            name: 'VaPlayer',
            type: 'embed',
            getUrl: (id) => `https://vaplayer.xyz/embed/movie/${id}`
        },
        zxcstreams: {
            name: 'ZXCStreams',
            type: 'embed',
            getUrl: (id) => `https://zxcstreams.com/embed/movie/${id}`
        },
        // KissKH (auto-generate) — gumagamit ng TMDB title para sa slug, pero kailangan ng episode ID (ep) na hindi natin makuha, kaya gagamit tayo ng placeholder.
        kisskh: {
            name: 'KissKH (Auto)',
            type: 'embed',
            getUrl: async (id, title, episode = '1') => {
                const slug = title ? title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : `movie-${id}`;
                // Gumamit ng default na ep=1 (hindi ito tama pero at least may URL)
                return `https://kisskh.nl/Drama/${slug}/Episode-${episode}?id=${id}&ep=1&page=0&pageSize=100`;
            }
        },
        // KissKH (Episode URL) — gagamit ng user-supplied URL
        kisskh_ep: {
            name: 'KissKH (Episode URL)',
            type: 'embed',
            getUrl: (id, title, extraUrl) => {
                if (!extraUrl) throw new Error('Kailangan ng episode URL. I-paste ito sa extra field.');
                return extraUrl;
            }
        },
        onetouchtv: {
            name: 'onetouchtv',
            type: 'embed',
            getUrl: (id) => `https://onetouchtv.com/embed/movie/${id}`
        },
        kkphim: {
            name: 'kkphim',
            type: 'embed',
            getUrl: (id) => `https://kkphim.com/phim/${id}`
        },
        flixhq: {
            name: 'FlixHQ',
            type: 'embed',
            getUrl: (id) => `https://flixhq.to/movie/${id}`
        },
        moviesapi: {
            name: 'MoviesAPI',
            type: 'embed',
            getUrl: (id) => `https://moviesapi.club/movie/${id}`
        },
        custom: {
            name: 'Custom Embed',
            type: 'embed',
            getUrl: (id, title, extraUrl) => {
                if (!extraUrl) throw new Error('Kailangan ng URL. I-paste ito sa extra field.');
                return extraUrl;
            }
        }
    };

    // --- DETECT embed vs HLS ---
    function isEmbedUrl(url) {
        const patterns = ['/embed/', 'vidsrc.cc', 'embed.su', '2embed.cc', 'showbox.media', 'febbox.com', '4khdhub.com', 'videasy.net', 'streamflix.to', 'vaplayer.xyz', 'zxcstreams.com', 'kisskh', 'onetouchtv.com', 'kkphim.com', 'flixhq.to', 'moviesapi.club'];
        return patterns.some(p => url.includes(p));
    }

    // --- INJECT FUNCTIONS ---
    function injectIframe(url) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allowFullscreen = true;
        iframe.allow = 'autoplay; encrypted-media; fullscreen';
        iframe.onload = () => { hideLoading(); addLog('🖼️ Iframe loaded!'); };
        iframe.onerror = () => { hideLoading(true); addLog('💥 Iframe load error', true); };
        video.parentNode.replaceChild(iframe, video);
        window.currentPlayer = iframe;
        addLog('✅ Injected iframe player');
    }

    function injectHLS(url, referer = null) {
        if (window.currentPlayer && window.currentPlayer.tagName === 'IFRAME') {
            const nv = document.createElement('video');
            nv.id = 'myMoviePlayer'; nv.controls = true; nv.style.width = '100%'; nv.style.height = '100%'; nv.style.background = '#000';
            window.currentPlayer.parentNode.replaceChild(nv, window.currentPlayer);
            window.currentPlayer = null;
            video = document.getElementById('myMoviePlayer');
        }
        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                xhrSetup: function(xhr, url) {
                    if (referer) xhr.setRequestHeader('Referer', referer);
                }
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { hideLoading(); addLog('🎉 HLS ready!'); video.play().catch(() => {}); });
            hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { hideLoading(true); addLog('💥 HLS error', true); } });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.onloadedmetadata = () => hideLoading();
            video.play();
        } else {
            hideLoading(true);
            addLog('🚫 HLS not supported', true);
        }
    }

    // --- CORE: Play a specific provider ---
    async function playProvider(providerKey, tmdbId, movieTitle = '', extraUrl = '') {
        const provider = PROVIDERS[providerKey];
        if (!provider) { addLog(`⚠️ Unknown provider: ${providerKey}`, true); return false; }

        try {
            let finalUrl;
            // Kung ang getUrl ay async, i-await
            if (provider.getUrl.constructor.name === 'AsyncFunction') {
                finalUrl = await provider.getUrl(tmdbId, movieTitle);
            } else {
                // Para sa mga provider na nangangailangan ng extraUrl (kisskh_ep, custom)
                if (providerKey === 'kisskh_ep' || providerKey === 'custom') {
                    finalUrl = provider.getUrl(tmdbId, movieTitle, extraUrl);
                } else {
                    finalUrl = provider.getUrl(tmdbId);
                }
            }
            addLog(`📡 Trying ${provider.name}...`);
            addLog(`🔗 URL: ${finalUrl.substring(0, 70)}...`);

            // Kung Vidlink, kailangan i-fetch ang JSON
            if (providerKey === 'vidlink') {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(finalUrl)}`;
                const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
                const data = await resp.json();
                if (data?.stream?.playlist) finalUrl = data.stream.playlist;
                else throw new Error('No stream from Vidlink');
                injectHLS(finalUrl, 'https://vidlink.pro/');
                return true;
            }

            if (isEmbedUrl(finalUrl)) {
                injectIframe(finalUrl);
                return true;
            } else if (finalUrl.includes('.m3u8')) {
                const referer = providerKey === 'kisskh' ? 'https://kisskh.nl/' : null;
                injectHLS(finalUrl, referer);
                return true;
            } else {
                video.src = finalUrl;
                video.onloadedmetadata = () => hideLoading();
                video.play();
                return true;
            }
        } catch (e) {
            addLog(`❌ ${provider.name} failed: ${e.message}`, true);
            return false;
        }
    }

    // --- PLAY MOVIE (manual selection) ---
    async function playMovie() {
        const tmdbId = movieIdInput.value.trim();
        const providerKey = providerSelect.value;

        // Kung ang provider ay nangangailangan ng extra URL, kunin ito
        let extraUrl = '';
        if (providerKey === 'kisskh_ep' || providerKey === 'custom') {
            extraUrl = extraUrlInput.value.trim();
            if (!extraUrl) {
                addLog('⚠️ Kailangan ng URL sa extra field. I-paste ang episode URL.', true);
                return;
            }
        }

        if (providerKey === 'auto') {
            await autoPlay();
            return;
        }

        resetPlayer();

        // Ipakita ang movie info kung may TMDB ID
        if (tmdbId) {
            const info = await fetchMovieInfo(tmdbId);
            movieInfoDisplay.textContent = `🎥 ${info.title} (${info.year}) — TMDB ID: ${tmdbId}`;
        } else {
            movieInfoDisplay.textContent = `📌 Gumagamit ng custom URL`;
        }

        showLoading(`⏳ Kinukuha ang ${PROVIDERS[providerKey]?.name || providerKey}...`);
        const success = await playProvider(providerKey, tmdbId, '', extraUrl);
        if (!success) {
            hideLoading(true);
            addLog('💡 Subukan ang "Auto-Find & Play" para maghanap ng working provider.', false);
        }
    }

    // --- AUTO-FIND & PLAY (FALLBACK CHAIN) ---
    async function autoPlay() {
        const tmdbId = movieIdInput.value.trim();
        if (!tmdbId) { addLog('⚠️ Maglagay ng TMDB ID!', true); return; }

        resetPlayer();
        const info = await fetchMovieInfo(tmdbId);
        movieInfoDisplay.textContent = `🎥 ${info.title} (${info.year}) — TMDB ID: ${tmdbId}`;

        addLog(`⚡ Nagsisimula ang AUTO-FIND para sa "${info.title}" (${tmdbId})`);
        addLog(`📡 Susubukan ang ${Object.keys(PROVIDERS).length} providers...`);

        showLoading(`🔍 Sinusubukan ang mga provider...`);

        // Priority order: una ang mga madalas gumana (huwag isama ang mga nangangailangan ng extra URL)
        const priorityOrder = ['showbox', 'vidsrc', '2embed', 'embed_su', 'vidsrc_cc', 'streamflix', 'videasy', 'vaplayer', 'zxcstreams', 'onetouchtv', 'kkphim', 'flixhq', 'moviesapi', '4khdhub', 'febbox', 'vidlink'];

        let success = false;
        let triedCount = 0;

        for (const key of priorityOrder) {
            if (!PROVIDERS[key]) continue;
            triedCount++;
            addLog(`🔍 [${triedCount}/${priorityOrder.length}] Sinusubukan ang ${PROVIDERS[key].name}...`);
            
            const result = await playProvider(key, tmdbId, info.title);
            if (result) {
                success = true;
                providerSelect.value = key;
                addLog(`🏆 <span class="winner">SUCCESS! ${PROVIDERS[key].name} ang gumana!</span>`);
                hideLoading();
                break;
            }
            await new Promise(r => setTimeout(r, 500));
        }

        if (!success) {
            hideLoading(true);
            addLog(`🚫 Walang gumana sa ${triedCount} providers.`, true);
            addLog('💡 Subukan ang "KissKH (Episode URL)" at i-paste ang episode URL.', false);
        }
    }

    // --- EVENT LISTENERS ---
    // Kapag nagbago ang provider, i-toggle ang extra input
    providerSelect.addEventListener('change', function() {
        toggleExtraInput(this.value);
        // Kung KissKH (Auto) ang napili, mag-prompt kung gusto nilang gumamit ng episode URL
        if (this.value === 'kisskh') {
            addLog('⚠️ Ang "KissKH (Auto)" ay gumagamit ng hula sa episode ID. Mas maaasahan ang "KissKH (Episode URL)" kung mayroon kang URL.', false);
        }
    });

    if (video) {
        video.addEventListener('play', () => addLog('▶️ Playing'));
        video.addEventListener('pause', () => addLog('⏸️ Paused'));
        video.addEventListener('ended', () => addLog('⏹️ Ended'));
    }

    // --- INIT ---
    toggleExtraInput(providerSelect.value);
    addLog('💡 Pumili ng provider. Para sa KissKH episodes, piliin ang "KissKH (Episode URL)" at i-paste ang URL.');
    addLog('📌 Halimbawa ng URL: https://kisskh.co/Drama/Knot--2026-/Episode-1?id=12007&ep=217358&page=0&pageSize=100');
</script>
</body>
</html>
