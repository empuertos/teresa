<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 900px; }
    h2 { text-align: center; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    select, button { padding: 12px; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 6px; font-size: 15px; }
    select { flex: 1; min-width: 180px; }
    button { cursor: pointer; background: #2a2a2a; }
    button:active { background: #444; }
    .player-box { width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    video { width: 100%; aspect-ratio: 16/9; display: block; }
    .status { margin-top: 10px; font-size: 14px; color: #00ff88; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>📺 Global IPTV Player</h2>

  <div class="controls">
    <select id="countrySelect" onchange="loadCountryPlaylist()">
      <option value="ph" selected>🇵🇭 Philippines</option>
      <option value="us">🇺🇸 United States</option>
      <option value="gb">🇬🇧 United Kingdom</option>
      <option value="jp">🇯🇵 Japan</option>
      <option value="kr">🇰🇷 South Korea</option>
    </select>

    <select id="channelSelect" onchange="playSelectedChannel()">
      <option value="">-- Loading Channels... --</option>
    </select>

    <button onclick="loadCountryPlaylist()" title="Refresh Playlist">🔄 Refresh</button>
  </div>

  <div class="player-box">
    <video id="video" controls autoplay playsinline></video>
  </div>
  
  <div id="status" class="status">Auto-fetching latest channels...</div>
</div>

<script>
  const PROXY = 'https://iptv-proxy.22afed28-f0b2-46d0-8804-c90e25c90bd4.workers.dev/?url=';

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const countrySelect = document.getElementById('countrySelect');
  const channelSelect = document.getElementById('channelSelect');
  let hls = null;

  async function loadCountryPlaylist() {
    const code = countrySelect.value;
    const cacheBuster = new Date().getTime(); 
    const m3uUrl = `https://iptv-org.github.io/iptv/countries/${code}.m3u?t=${cacheBuster}`;
    
    status.innerText = `Refreshing ${code.toUpperCase()} channel list...`;
    channelSelect.innerHTML = '<option value="">-- Fetching latest list... --</option>';

    try {
      const response = await fetch(m3uUrl, { cache: "no-store" });
      const text = await response.text();
      parseM3U(text);
    } catch (err) {
      status.innerText = 'Failed to load playlist for this country.';
    }
  }

  function parseM3U(m3uText) {
    const lines = m3uText.split('\n');
    channelSelect.innerHTML = '<option value="">-- Select Channel --</option>';

    // Pinned working channels for Philippines
    if (countrySelect.value === 'ph') {
      const pinnedGroup = document.createElement('optgroup');
      pinnedGroup.label = '⭐ Working / Custom Channels';
      
      const cctnOpt = document.createElement('option');
      cctnOpt.value = 'http://122.55.252.134:8443/live/bba5b536faeacb9b56a3239f1ee8e3b3/1.m3u8';
      cctnOpt.innerText = 'CCTN 47 (Direct Stream)';
      pinnedGroup.appendChild(cctnOpt);

      channelSelect.appendChild(pinnedGroup);
    }

    const autoGroup = document.createElement('optgroup');
    autoGroup.label = '🌐 Auto-Fetched Channels';

    let currentName = '';
    lines.forEach(line => {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const parts = line.split(',');
        currentName = parts[parts.length - 1] || 'Unknown Channel';
      } else if (line.startsWith('http')) {
        if (currentName) {
          const opt = document.createElement('option');
          opt.value = line;
          opt.innerText = currentName;
          autoGroup.appendChild(opt);
          currentName = '';
        }
      }
    });

    channelSelect.appendChild(autoGroup);
    status.innerText = `Updated! Loaded channels successfully.`;
  }

  function playSelectedChannel() {
    const rawUrl = channelSelect.value;
    if (!rawUrl) return;

    const proxiedUrl = PROXY + encodeURIComponent(rawUrl);
    status.innerText = 'Connecting to stream...';

    if (hls) hls.destroy();

    if (Hls.isSupported()) {
      hls = new Hls({
        manifestLoadingTimeOut: 15000,
        manifestLoadingMaxRetry: 4,
        levelLoadingMaxRetry: 4,
        fragLoadingMaxRetry: 6,
        enableWorker: true
      });

      hls.loadSource(proxiedUrl);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        status.innerText = 'Playing stream!';
        video.play().catch(() => status.innerText = 'Click play on the video player.');
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              status.innerText = 'Network error. Retrying...';
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              status.innerText = 'Media error. Recovering...';
              hls.recoverMediaError();
              break;
            default:
              status.innerText = 'Stream offline or geo-restricted by source.';
              hls.destroy();
              break;
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxiedUrl;
      video.play();
    }
  }

  window.onload = () => {
    loadCountryPlaylist();
  };
</script>

</body>
</html>
