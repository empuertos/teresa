<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume & CV Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Resume & CV Builder</h1>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('resume', event)">Resume</button>
        <button class="tab-btn" onclick="switchTab('cv', event)">CV (Academic)</button>
      </div>
    </header>

    <main>
      <!-- Resume Section -->
      <section id="resume-tab" class="tab-content active">
        <h2>Resume Details</h2>

        <div class="form-group">
          <label for="job-title">Job Title</label>
          <div class="input-with-btn">
            <input type="text" id="job-title" placeholder="e.g. Software Engineer, Marketing Manager">
            <button type="button" class="autofill-btn" onclick="autoFillFromJobTitle('resume')">✨ Auto-Fill from Job Title</button>
          </div>
        </div>

        <div class="form-group">
          <label for="prof-summary">Professional Summary</label>
          <textarea id="prof-summary" rows="4" placeholder="Enter or auto-fill summary..."></textarea>
        </div>

        <div class="form-group">
          <label for="skills">Relevant Skills (comma separated)</label>
          <input type="text" id="skills" placeholder="e.g. JavaScript, React, Project Management">
        </div>
      </section>

      <!-- CV Section -->
      <section id="cv-tab" class="tab-content">
        <h2>CV Details (Academic)</h2>

        <div class="form-group">
          <label for="academic-title">Academic Title / Position</label>
          <div class="input-with-btn">
            <input type="text" id="academic-title" placeholder="e.g. Assistant Professor, Research Fellow">
            <button type="button" class="autofill-btn" onclick="autoFillFromJobTitle('cv')">✨ Auto-Fill from Job Title</button>
          </div>
        </div>

        <div class="form-group">
          <label for="academic-summary">Academic Summary</label>
          <textarea id="academic-summary" rows="4" placeholder="Enter or auto-fill academic summary..."></textarea>
        </div>

        <div class="form-group">
          <label for="academic-skills">Research & Academic Skills (comma separated)</label>
          <input type="text" id="academic-skills" placeholder="e.g. Grant Writing, Data Analysis, Curriculum Development">
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
